name: Pages

# 把 website/ 发布成 GitHub Pages，作为安装包的下载落地页。
#
# 只监听 website/ 的改动：这个工作流与代码无关，改后端代码时不该重跑一遍部署。
# 注意：`paths` 过滤一旦写错（比如漏了 workflow 自己）就会出现「改了工作流但不生效」
# 的死角，所以这里把工作流文件本身也列进去。
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Pages 部署需要的三件套：读仓库用 contents，写 Pages 站点用 pages，
# 跨域信任（OIDC）用 id-token。
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；新的一次直接取代旧的（官网不需要排队）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # ── 前置检查：Pages 没开就给出可执行的下一步 ──
      # 为什么**不**用 `configure-pages` 的 `enablement: true` 自动开启：那一版实测失败
      # （run 34941730544）—— 报 `HttpError: Resource not accessible by integration`。
      # 因为 workflow 的 GITHUB_TOKEN 没有权限调「创建 Pages 站点」那个 API（它要求仓库
      # 管理员身份），所以「自动开启」这条路本身不成立，留给用户的只有一句没人看得懂的
      # API 报错。这里换成一个显式可读的检查：没启用就带着操作指引失败。
      - name: 检查 Pages 是否已启用
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$code" != "200" ]; then
            echo "::error::Pages 尚未启用（GET /repos/${{ github.repository }}/pages 返回 $code）。请在仓库 Settings → Pages → Build and deployment → Source 选择 “GitHub Actions” 并保存，然后重新运行本工作流。这是一次性设置。"
            exit 1
          fi
          echo "Pages 已启用，继续部署。"

      - uses: actions/configure-pages@v5

      # 上传的是 website/ 的**内容**（index.html 落在站点根），不是 website 这一层目录。
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
