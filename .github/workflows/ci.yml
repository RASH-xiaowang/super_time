name: CI

# 上线门禁的最小闭环：类型检查、测试、构建一致性与各条 smoke。
# 之所以跑 windows-latest：依赖里有 win32 原生二进制（koffi-win32-x64、wx_silk.exe、
# whisper bin），Linux/ubuntu runner 上装不起来，也无法验证真正的运行路径。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # 2026-09-20 由 30 提到 45：runner（共享 2 核 + 实时扫描）比本机慢约 24 倍
    # （整批用例耗时 2658s vs 本机 109s），单元测试一步实测已占 26 分钟；而 4 条重夹具
    # 用例此前是「快速超时」（4×180s）才刚好挤进 30 分钟 —— 它们现在会真的跑完，
    # 30 分钟会把作业整条杀掉（那是比「用例失败」更差的信号）。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      # ── Electron 二进制要单独取 ──
      # `node_modules/electron` 这个包在本仓库里没有 postinstall（包的 `scripts` 字段是空的），
      # 所以 `npm ci` 只装 JS 包、不落 `dist/electron.exe`。而「安全守卫」「后端崩溃自愈」
      # 两步要启动真窗口 —— 2026-09-20 在 CI 上实测：`❌ 找不到可执行文件 …electron.exe`。
      # 已有二进制时这一步是快速空操作。
      - name: 准备 Electron 二进制（冒烟要真窗口）
        run: node node_modules/electron/install.js

      # ── 类型检查（H11）：前端类型只从仓库里的 lib/types 取（tsconfig 的 paths），
      #    所以这一步同时兜住「后端类型漂移」与「前端镜像滞后」两类问题。
      - name: 类型检查
        run: npm run typecheck

      # ── 构建一致性：运行时只加载 lib/index.js 这一份产物，
      #    改了 src/**/*.ts 忘记重建就会静默跑旧代码（wechat-host.js 直接 import 它）。
      #    门禁 = 重建后产物必须与提交的逐字节一致。
      - name: 后端 bundle 与源码一致
        run: |
          node scripts/build-wechat-bundle.js
          git diff --exit-code -- src/backend/wechat-data/lib/index.js
        shell: pwsh

      # ── 声明产物一致性（H12）：lib/types/**/*.d.ts 是前端取类型的唯一来源，
      #    同样会出现「改了 src 忘记重生成」的静默漂移。
      - name: 后端类型声明与源码一致
        run: |
          npm run build:types
          git diff --exit-code -- src/backend/wechat-data/lib/types
        shell: pwsh

      # ── 接口参考一致性（H14）：docs/API.md 由 gateway.ts 的 @Remote 自动生成，
      #    改了方法面却忘记重生成的话，外部读者看到的方法清单就是错的（历史上曾三方打架）。
      - name: 接口参考与源码一致
        run: npm run docs:api:check

      - name: 单元测试
        run: npm test

      - name: 前端构建
        run: npm run build:ui

      - name: 前端 shim 与源码一致
        run: npm run check:shim

      # 安全守卫的端到端探针（H10）：在真实渲染进程里尝试 file:/smb:/自定义协议开窗
      # 与外部导航，断言全部被拒。打包态另外由 npm run security-guard:smoke:packaged 覆盖。
      - name: 安全守卫（开窗/导航被拒）
        run: npm run security-guard:smoke

      - name: 主题令牌校验（需先 build:ui）
        run: npm run check:wx-tokens

      - name: 检索层回归
        run: npm run rag:check

      - name: 问答界面 SSR 冒烟
        run: npm run ui:smoke

      # M3 真机验收（导出进度与中止）—— 2026-09-22 这一刀是被它逼出来的：网关
      # `exportSessionMessages` 的入参里没有 jobId，客户端传了也在 RPC 边界被静默咽掉，
      # 而当时**所有源码级守卫都是绿的**（它们只看客户端有没有传、只看中继那一行在不在）。
      # 所以把这份「真点一次按钮」的脚本钉进门禁：Playwright 驱动真实 Electron，
      # 合成 4 万条会话，走 后端 → 主进程 → ui-entry → DOM 事件 → 面板 整条链，
      # 断言进度按 jobId 认领、总量未知时走不定量态、点中止后停在终态且不留 `.partial-*`。
      # 需要真窗口（前面「准备 Electron 二进制」那步已备好）；`playwright` 是 devDependency，
      # `_electron.launch` 用本地 electron.exe，不需要下载浏览器。
      # 单步上限 12 分钟：脚本里的等待多是墙上时钟（不随 CPU 变慢线性放大），
      # CPU 重的部分（4 万条插入 + xlsx 压缩）在 runner 上实测留了足够余量。
      - name: 导出进度与中止（真机 e2e，M3）
        timeout-minutes: 12
        run: npm run e2e:export-progress

      # 隐私同意闸门（H14）：未勾选时按钮必须是禁用态 —— SSR 渲染事实，不是读代码。
      - name: 隐私同意闸门 SSR 冒烟
        run: npm run privacy-gate:smoke

      - name: 知识图谱后端冒烟
        run: npm run check:knowledge-graph

      - name: 朋友圈视频密钥流校验
        run: npm run check:sns-video

      - name: whisper 路径不变量
        run: npm run check:whisper-paths

      - name: 许可签发链路
        run: npm run license-smoke

      - name: 许可门禁（无证/过期/伪造一律拒绝）
        run: npm run license-gate:smoke

      # 端到端：杀掉后端 worker 进程 → 自动重建 → 功能恢复。
      # 需要真实 GUI 会话（会启动 Electron）；调用超时等竞态分支由
      # npm test 里的 src/backend/tests/backend-rpc.spec.ts 确定性覆盖。
      # 若这一步在 CI 上不稳定，请把它拆成单独的工作流，**不要直接删** ——
      # 它是「后端进程死了能否自己回来」的唯一自动化证据。
      - name: 后端崩溃自愈
        run: npm run check:backend-restart
