name: CI

# 上线门禁的最小闭环：类型检查、测试、构建一致性与各条 smoke。
# 之所以跑 windows-latest：依赖里有 win32 原生二进制（koffi-win32-x64、wx_silk.exe、
# whisper bin），Linux/ubuntu runner 上装不起来，也无法验证真正的运行路径。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      # ── 类型检查（H11）：前端类型只从仓库里的 lib/types 取（tsconfig 的 paths），
      #    所以这一步同时兜住「后端类型漂移」与「前端镜像滞后」两类问题。
      - name: 类型检查
        run: npm run typecheck

      # ── 构建一致性：运行时只加载 lib/index.js 这一份产物，
      #    改了 src/**/*.ts 忘记重建就会静默跑旧代码（wechat-host.js 直接 import 它）。
      #    门禁 = 重建后产物必须与提交的逐字节一致。
      - name: 后端 bundle 与源码一致
        run: |
          node scripts/build-wechat-bundle.js
          git diff --exit-code -- src/backend/wechat-data/lib/index.js
        shell: pwsh

      # ── 声明产物一致性（H12）：lib/types/**/*.d.ts 是前端取类型的唯一来源，
      #    同样会出现「改了 src 忘记重生成」的静默漂移。
      - name: 后端类型声明与源码一致
        run: |
          npm run build:types
          git diff --exit-code -- src/backend/wechat-data/lib/types
        shell: pwsh

      - name: 单元测试
        run: npm test

      - name: 前端构建
        run: npm run build:ui

      - name: 前端 shim 与源码一致
        run: npm run check:shim

      - name: 主题令牌校验（需先 build:ui）
        run: npm run check:wx-tokens

      - name: 检索层回归
        run: npm run rag:check

      - name: 问答界面 SSR 冒烟
        run: npm run ui:smoke

      - name: 知识图谱后端冒烟
        run: npm run check:knowledge-graph

      - name: 朋友圈视频密钥流校验
        run: npm run check:sns-video

      - name: whisper 路径不变量
        run: npm run check:whisper-paths

      - name: 许可签发链路
        run: npm run license-smoke

      - name: 许可门禁（无证/过期/伪造一律拒绝）
        run: npm run license-gate:smoke

      # 端到端：杀掉后端 worker 进程 → 自动重建 → 功能恢复。
      # 需要真实 GUI 会话（会启动 Electron）；调用超时等竞态分支由
      # npm test 里的 src/backend/tests/backend-rpc.spec.ts 确定性覆盖。
      # 若这一步在 CI 上不稳定，请把它拆成单独的工作流，**不要直接删** ——
      # 它是「后端进程死了能否自己回来」的唯一自动化证据。
      - name: 后端崩溃自愈
        run: npm run check:backend-restart
