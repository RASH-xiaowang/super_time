name: CI

# 上线门禁的最小闭环：类型检查、测试、构建一致性与各条 smoke。
# 之所以跑 windows-latest：依赖里有 win32 原生二进制（koffi-win32-x64、wx_silk.exe、
# whisper bin），Linux/ubuntu runner 上装不起来，也无法验证真正的运行路径。
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    # 2026-09-20 由 30 提到 45：runner（共享 2 核 + 实时扫描）比本机慢约 24 倍
    # （整批用例耗时 2658s vs 本机 109s），单元测试一步实测已占 26 分钟；而 4 条重夹具
    # 用例此前是「快速超时」（4×180s）才刚好挤进 30 分钟 —— 它们现在会真的跑完，
    # 30 分钟会把作业整条杀掉（那是比「用例失败」更差的信号）。
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-10-09 加：`check:mutation:diff` 要用 `git diff <base>...HEAD` 算改动文件，
          # 默认的浅克隆（depth=1）拿不到 base ⇒ 脚本会退化成全量（25~30 分钟），把这条 job 顶爆。
          # 现在它退化的代价是「多跑一会儿」，但仍然会跑，所以浅克隆在这里是**慢**而不是**错**；
          # 拉全历史只是让它快。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      # ── Electron 二进制要单独取 ──
      # `node_modules/electron` 这个包在本仓库里没有 postinstall（包的 `scripts` 字段是空的），
      # 所以 `npm ci` 只装 JS 包、不落 `dist/electron.exe`。而「安全守卫」「后端崩溃自愈」
      # 两步要启动真窗口 —— 2026-09-20 在 CI 上实测：`❌ 找不到可执行文件 …electron.exe`。
      # 已有二进制时这一步是快速空操作。
      - name: 准备 Electron 二进制（冒烟要真窗口）
        run: node node_modules/electron/install.js

      # ── 类型检查（H11）：前端类型只从仓库里的 lib/types 取（tsconfig 的 paths），
      #    所以这一步同时兜住「后端类型漂移」与「前端镜像滞后」两类问题。
      - name: 类型检查
        run: npm run typecheck

      # ── 构建一致性：运行时只加载 lib/index.js 这一份产物，
      #    改了 src/**/*.ts 忘记重建就会静默跑旧代码（wechat-host.js 直接 import 它）。
      #    门禁 = 重建后产物必须与提交的逐字节一致。
      - name: 后端 bundle 与源码一致
        run: |
          node scripts/build-wechat-bundle.js
          git diff --exit-code -- src/backend/wechat-data/lib/index.js
        shell: pwsh

      # ── 声明产物一致性（H12）：lib/types/**/*.d.ts 是前端取类型的唯一来源，
      #    同样会出现「改了 src 忘记重生成」的静默漂移。
      - name: 后端类型声明与源码一致
        run: |
          npm run build:types
          git diff --exit-code -- src/backend/wechat-data/lib/types
        shell: pwsh

      # ── 接口参考一致性（H14）：docs/API.md 由 gateway.ts 的 @Remote 自动生成，
      #    改了方法面却忘记重生成的话，外部读者看到的方法清单就是错的（历史上曾三方打架）。
      - name: 接口参考与源码一致
        run: npm run docs:api:check

      # 单元测试：跑的是 `npm test`，但走一层包装 —— 只有「已归因的 vitest RPC 假红」
      # （用例全过 + 退出码非 0 + 日志里有 `Timeout calling "onTaskUpdate"`）才允许自动重跑一次，
      # 且必须把第一次的榜首文件与秒数写进 step summary（PR 页面可见）。
      # 政策与三条判据见 docs/RELEASE-PLAN.md 的 N36 与 src/backend/tests/helpers/ci-unit-retry.ts。
      - name: 单元测试
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-unit-step.mjs

      - name: 前端构建
        run: npm run build:ui

      - name: 前端 shim 与源码一致
        run: npm run check:shim

      # ── 2026-10-09 阶段 2：第一档检查（清单与实测成本见 scripts/ci-tiers.mjs）──────────
      # 之前这三件都不在门禁里：`lint:db` 是绿的但**新违规没人拦**，`check:deps-provenance`
      # 0.2 秒却等于没跑，408 条变异自证**完全没进过 CI**。绿而不设门禁等于没检查。
      - name: 后端源码 lint
        run: npm run lint:db

      - name: 依赖来源核对
        run: npm run check:deps-provenance

      # 8 个便宜的性能基准。2026-10-09 实测 19 秒；此前它们只贡献一行 `skipped`，
      # 因为每个都用 `describe.skipIf(MEASURE_xxx !== '1')` 守着，而 package.json 里
      # 一个 MEASURE_* script 都没有 —— 于是「有基准」这件事一直是假的。
      - name: 性能基准（8 个快的）
        timeout-minutes: 10
        run: npm run measure:quick

      # 纯 Node 冒烟与真 Electron 冒烟（都是秒级，实测成本写在 scripts/ci-tiers.mjs 里）。
      - name: 检索冒烟
        run: npm run rag:smoke

      - name: EPIPE 崩溃冒烟
        run: npm run epipe:smoke

      - name: 渲染层 console 进诊断日志（真机 e2e）
        timeout-minutes: 10
        run: npm run renderer-console:e2e

      - name: UI 冒烟（真机 e2e）
        timeout-minutes: 10
        run: npm run ui:e2e-smoke

      - name: 导航壳（真机 e2e）
        timeout-minutes: 10
        run: npm run ui:nav-e2e

      - name: 加载态恢复（真机 e2e）
        timeout-minutes: 10
        run: npm run ui:loading-e2e

      # 变异自证的**增量**档：只跑这次改动波及的那些。
      # 口径是「目标文件改了 **或** 它的判据 spec 改了」——只按目标文件筛会漏掉
      # 「把守卫削弱一点」那类改动（spec 变松了但目标文件没动，于是那条变异不再咬红，
      # 而登记表与全量单测都还是绿的）。2026-10-09 实测：45 条 vs 53 条。
      # 基线 ref：push 用 before、PR 用 base.sha；两者在 Actions 里名字不同，收在脚本里
      # （npm script 在 Windows 的 cmd 里没法拼参数）。拿不到 diff 时脚本退化成全量。
      - name: 变异自证（增量）
        timeout-minutes: 25
        run: npm run check:mutation:diff
        env:
          SUPERTIME_MUTATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}

      # 安全守卫的端到端探针（H10）：在真实渲染进程里尝试 file:/smb:/自定义协议开窗
      # 与外部导航，断言全部被拒。打包态另外由 npm run security-guard:smoke:packaged 覆盖。
      - name: 安全守卫（开窗/导航被拒）
        run: npm run security-guard:smoke

      - name: 主题令牌校验（需先 build:ui）
        run: npm run check:wx-tokens

      - name: 检索层回归
        run: npm run rag:check

      - name: 问答界面 SSR 冒烟
        run: npm run ui:smoke

      # 隐私同意闸门（H14）：未勾选时按钮必须是禁用态 —— SSR 渲染事实，不是读代码。
      - name: 隐私同意闸门 SSR 冒烟
        run: npm run privacy-gate:smoke

      # 启动页四个内容页 + 授权面板：分组名与 nav-config 真源现算比对（2026-09-30 内容重写配套）。
      - name: 启动页内容 SSR 冒烟
        run: npm run onboarding:smoke

      # 词云卡片：撒点态要宽度、SSR 走 flex 回落 —— 只有真渲染一次才看得到（2026-09-30 词云重做配套）。
      - name: 词云卡片 SSR 冒烟
        run: npm run wordcloud:smoke

      # 模型探针（测试连接 / 查询余额）+ 左下角余额条：首帧渲染事实（2026-09-30 新功能）。
      - name: 模型探针 / 余额条 SSR 冒烟
        run: npm run llm-balance:smoke

      - name: 知识图谱后端冒烟
        run: npm run check:knowledge-graph

      - name: 朋友圈视频密钥流校验
        run: npm run check:sns-video

      - name: whisper 路径不变量
        run: npm run check:whisper-paths

      - name: 许可签发链路
        run: npm run license-smoke

      - name: 许可门禁（无证/过期/伪造一律拒绝）
        run: npm run license-gate:smoke

      # 端到端：杀掉后端 worker 进程 → 自动重建 → 功能恢复。
      # 需要真实 GUI 会话（会启动 Electron）；调用超时等竞态分支由
      # npm test 里的 src/backend/tests/backend-rpc.spec.ts 确定性覆盖。
      # 若这一步在 CI 上不稳定，请把它拆成单独的工作流，**不要直接删** ——
      # 它是「后端进程死了能否自己回来」的唯一自动化证据。
      - name: 后端崩溃自愈
        run: npm run check:backend-restart

      # M3 真机验收（导出进度与中止）—— 2026-09-22 这一刀是被它逼出来的：网关
      # `exportSessionMessages` 的入参里没有 jobId，客户端传了也在 RPC 边界被静默咽掉，
      # 而当时**所有源码级守卫都是绿的**（它们只看客户端有没有传、只看中继那一行在不在）。
      # 所以把这份「真点一次按钮」的脚本钉进门禁：Playwright 驱动真实 Electron，合成 4 万条
      # 会话，走 后端 → 主进程 → ui-entry → DOM 事件 → 面板 整条链，断言进度按 jobId 认领、
      # 总量未知时走不定量态、点中止后停在终态且不留 `.partial-*`；并用 1280×620 的矮视口
      # 保证「弹窗溢出时按钮仍滚得到」（第一轮 CI 红就红在这条上，量出的是真缺陷：
      # 手写弹层的覆盖层不可滚，小窗口下「导出/中止」整颗按钮点不到 —— 已按 kit Dialog 的
      # 做法修成可滚）。需要真窗口（前面「准备 Electron 二进制」那步已备好）；`playwright`
      # 是 devDependency，`_electron.launch` 用本地 electron.exe，不需要下载浏览器。
      # **放在最后一步**：它红过就会把后面的步骤全部跳过（实测吞掉了 7 步的信号），
      # 而它自己跑完只要 ~40 秒。
      - name: 导出进度与中止（真机 e2e，M3）
        timeout-minutes: 12
        run: npm run e2e:export-progress

      # H14 真机验收（隐私同意排在授权之前）—— 2026-09-23 这一条是补上的：那道顺序此前
      # 只有 SSR / 纯逻辑 / AST 三层证据，而**三层都证明不了闸门的先后**。读代码看到的顺序
      # 恰恰是「同意在授权之后」，后果是「机器上没有效许可证 ⇒ 用户永远看不到同意屏」
      # （全新 userData 实测：第一屏 0 个复选框）。这里起 4 次真 Electron 逐条量：
      # 走「下一页」先到同意屏、未勾选时按钮点不动、这一站没有「下一页」、点授权标签跳不过去、
      # 「不同意并退出」真的让主进程结束、同意之后落到授权站、真重启不再问第二次。
      # **不需要厂商私钥、不需要许可证**（同意屏现在就排在授权之前）⇒ 与 N23 那类
      # 「本机才成立」的验收不同，这条在干净检出上成立。两组变异自证：把 `requireConsent`
      # 摘掉 ⇒ 红在「走到的是授权屏」；删掉同意站的归一 ⇒ 红在「点标签跳不过去」。
      - name: 隐私同意先于授权（真机 e2e，H14）
        timeout-minutes: 12
        run: npm run e2e:h14-consent


  # ── 2026-10-09 阶段 2：变异登记表被动时，才起这条全量 job ──────────────────────
  #
  # 为什么要单独一条 job：`verify` 的单测已占 26 分钟、上限 45 分钟，而全量 408 条变异
  # 按每条约 4 秒（vitest 冷启动主导）估是 25~30 分钟 —— 塞进去会整条被杀掉。
  # 「作业超时」比「用例失败」难查得多，所以宁可多一个**只在需要时才起**的 job。
  #
  # 什么时候需要：变异登记表本身（scripts/mutations-registry*.mjs）被改动时。
  # 那时按文件筛选已经没有意义 —— 筛选的基准就是被改的那个东西
  # （见 scripts/mutation-scope.mjs）。
  #
  # 探针为什么是个脚本：Actions 的 job 级 `if:` 做不了文件匹配，只能先跑一个极快的
  # 步骤把结论写进 step output。拿不到 diff 时它输出「要跑」——静默跳过是最坏的结果。
  mutation-full:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      - name: 判断这次改动要不要跑全量变异反证
        id: probe
        run: node scripts/ci-needs-full-mutation.mjs "${{ github.event.pull_request.base.sha || github.event.before }}"

      - name: 变异自证（全量 408 条）
        if: steps.probe.outputs.needs_full_mutation == 'true'
        timeout-minutes: 70
        run: npm run check:mutation
