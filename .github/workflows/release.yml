name: Release

# 打 tag（如 v1.2.0）即发布：构建 NSIS 安装包，并把 exe / latest.yml / blockmap 传到
# GitHub Releases。安装版的自动更新正是从这次 Release 拉 latest.yml 的 ——
# 所以「本工作流成功」≈「用户能收到这次更新」，两者不是两件事。
#
# 为什么不监听分支：更新只在版本号变化时才发生，而版本号由 tag 决定。
# 每次 push 都发一版会让 latest.yml 反复被覆盖，客户端下到的可能是半成品。
on:
  push:
    tags: ['v*']

# electron-builder 要往 Releases 写资产
permissions:
  contents: write

# 串行发布：两次 tag 同时跑会让两个进程抢着写同一个 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # tag push 不会触发 ci.yml，因此全量变异自证必须在发布链路里自己跑一遍。
    # 单元测试、全量变异、打包态检查串行后耗时明显高于旧上限，给足 Windows runner 余量。
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          # 2026-10-16 加：`npm test` 里的 `mutation-scope.spec.ts` 会跑
          # `git diff --name-only HEAD~1...HEAD` 来验证「增量选取与登记表对得上」，
          # 而默认的浅克隆（depth=1）没有 `HEAD~1` ⇒ 该用例必红（v1.0.8 首次发布实测：
          # 单元测试 1 failed / 5467 passed，后续打包与发布步骤全被跳过）。
          # 与 ci.yml / nightly.yml 保持一致：拉全历史。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      # ── Electron 二进制要单独取 ──
      # 2026-10-16 加：`node_modules/electron` 这个包在本仓库里没有 postinstall
      # （包的 `scripts` 字段是空的），所以 `npm ci` 只装 JS 包、不落 `dist/electron.exe`。
      # 而「朋友圈视频 · 打包件字节比对」要跑 `node_modules/electron/dist/electron.exe`
      # 来验证打包版加载的 wasm 在 Electron 运行时下能实例化 —— 缺了它 spawnSync 直接
      # ENOENT（status=null），被脚本误报成「超时」（v1.0.8 发布实测踩到）。
      # ci.yml / nightly.yml 都有这一步，唯独 release.yml 漏了。
      - name: 准备 Electron 二进制（打包件比对要真 Electron 运行时）
        run: node node_modules/electron/install.js

      # ── 发布门禁：必须在这里自己跑 ──
      # ci.yml 只监听分支（`branches: ['**']` 不匹配 tag），**tag 推送不会触发它**，
      # 所以「CI 绿了再发版」这条链路并不成立 —— 不自己跑就等于没验过就发版。
      - name: 类型检查
        run: npm run typecheck

      # 2026-10-16：改用 `ci-unit-step.mjs` 包装（与 ci.yml 一致），不再直接 `npm test`。
      # 原因：vitest 在 CI 上偶发「已归因的 RPC 假红」——用例全过（5468 passed）但
      # worker 报 `Timeout calling "onTaskUpdate"` ⇒ 退出码 1。ci.yml 有这层包装
      # （按 N36 政策允许一次带记录的重跑），而 release.yml 直接跑 npm test 就会
      # 把这种假红当成真失败，把整条发布链掐断（v1.0.8 实测：单元测试 5468 passed
      # 却判 failure，后续打包与发布全被跳过）。
      - name: 单元测试
        shell: pwsh
        env:
          # 2026-10-16：发布链把「已归因的假红」重跑上限提到 3（PR 门禁仍是默认 1）。
          # 理由：tag 推送不会自动重跑整条工作流，而这类假红是环境停顿（分段墙钟已证明
          # 不在测试代码里），CI 上连续两次撞上并不罕见（v1.0.8 实测：两次都是
          # 5468 passed + onTaskUpdate 超时 + 退出码 1）。判据没放宽 —— 每次重跑前仍要过
          # classifyRun 三条，出现真失败立刻红。
          SUPERTIME_UNIT_MAX_RETRIES: '3'
        run: |
          $out = node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/ci-unit-step.mjs 2>&1 | Out-String
          Write-Host $out
          if ($env:GITHUB_STEP_SUMMARY) {
            "## 单元测试（发布门禁）`n`n``````n$out`n``````" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # tag 发布只走这条 workflow，而 nightly 可能排在发版之后；发版产物比 PR
      # 门禁更接近用户，不能只靠「合并前绿过」或夜间档的异步证明。
      - name: 变异自证（全量）
        timeout-minutes: 60
        run: npm run check:mutation

      # 与 PR 门禁同级的便宜静态检查：发版前不能比合并前更宽松。
      - name: 接口参考与源码一致
        run: npm run docs:api:check

      - name: 后端源码 lint
        run: npm run lint:db

      - name: 依赖来源核对
        run: npm run check:deps-provenance

      # tag push 不触发 ci.yml，所以这里不能只依赖「合并前绿过」。
      # pack/dist 虽然会重建入库产物，但不能靠打包时“顺手修好”蒙混过：
      # 发布前先要求重建后 git diff 为空，避免发布包与 tag 源码不一致。
      - name: 后端 bundle 与源码一致
        run: npm run check:backend
        shell: pwsh

      - name: 后端类型声明与源码一致
        run: npm run check:types
        shell: pwsh

      - name: 性能基准（18 个快的）
        timeout-minutes: 10
        run: npm run measure:quick

      # ── 版本一致性门禁 ──
      # 最容易犯、也最难发现的错：tag 写 v1.2.0 而 package.json 还是 1.0.0。
      # 这样打出来的包 app.getVersion() 是 1.0.0，latest.yml 里的版本也是 1.0.0，
      # electron-updater 于是判定「没有新版本」—— 升级**永远不发生**，
      # 而且主进程不会报任何错（连日志都没有）。只能靠这道门禁挡。
      - name: tag 与 package.json 版本必须一致
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [string]$env:GITHUB_REF_NAME
          if ([string]::IsNullOrWhiteSpace($tag)) { throw "GITHUB_REF_NAME 为空，无法校验版本" }
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "非法发布 tag：'$tag'。只接受 v<major>.<minor>.<patch> 及可选预发布后缀。"
          }
          $ver = $Matches[1]
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($ver -ne $pkg) {
            throw "tag '$tag' 与 package.json 的版本 '$pkg' 不一致 —— 更新将永远不会被触发"
          }
          Write-Host "版本一致：$tag"

      # `npm run dist` = 先 build:all 再 electron-builder --win nsis。
      # 正式构建使用 `--publish never`：先在本地产出并签名，内容/签名/更新摘要门禁
      # 全部通过后，再由下面的 PowerShell 步骤上传为草稿并在验收后公开。
      # ── 2026-10-09 阶段 2：第三档（打包态）检查，**必须在发布之前** ──────────────
      #
      # 为什么插在正式构建前：打包态检查一旦放到签名构建之后，失败时安装包已经生成；
      # 如果同时误用自动发布，版本甚至可能已经对外可见。
      # 而打包态恰恰是最容易「源码态绿、打包后坏」的一类（asar、resources 路径
      # 只在打包态才成立，源码态根本走不到那段代码）。
      #
      # `npm run pack` 只做 `electron-builder --dir`（不产安装包），比 `dist` 快，
      # 够这三个冒烟读 `dist/win-unpacked` 用。
      - name: 打包态准备（仅 --dir，不出安装包）
        run: npm run pack
        timeout-minutes: 30

      # 朋友圈视频那条通路的打包件比对。⚠️ 它**缺打包件时会 exit 0**（脚本自己打印
      # 「这一条不算通过」但退出码是 0）—— 所以它只在这个「刚 pack 过」的 job 里有意义，
      # 放进任何一个没有 `npm run pack` 的门禁都是空跑的绿灯。
      - name: 朋友圈视频 · 打包件字节比对
        run: npm run package:sns-video:smoke
        timeout-minutes: 10

      - name: 密钥迁移打包态冒烟（M1）
        run: npm run m1-secrets:smoke
        timeout-minutes: 10

      # 这些打包态检查此前只存在于 nightly：发版产物比合并门禁更接近用户，不能漏。
      - name: 打包态冒烟（内容 / 体积 / 依赖闭包 / 方法数）
        run: npm run package:smoke
        timeout-minutes: 25

      - name: 打包态安全守卫（开窗 / 导航被拒）
        run: npm run security-guard:smoke:packaged
        timeout-minutes: 10

      - name: 前端 shim 与源码一致
        run: npm run check:shim

      - name: 检查发布签名凭据
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SUPERTIME_WIN_PUBLISHER_NAME: ${{ secrets.WINDOWS_CERT_PUBLISHER_NAME }}
        run: |
          $missing = @('CSC_LINK', 'CSC_KEY_PASSWORD', 'SUPERTIME_WIN_PUBLISHER_NAME') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing.Count -gt 0) {
            throw "缺少发布签名 secret：$($missing -join ', ')。未签名包禁止发布。"
          }

      # 正式包必须签名后才允许进入上传步骤；--publish never 保证门禁失败时
      # Release 上不会先出现一个未验证的安装包。
      - name: 构建并签名发行包（不发布）
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          SUPERTIME_WIN_PUBLISHER_NAME: ${{ secrets.WINDOWS_CERT_PUBLISHER_NAME }}
        run: |
          npm run dist -- --publish never --config.forceCodeSigning=true "--config.win.signtoolOptions.publisherName=$env:SUPERTIME_WIN_PUBLISHER_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 签名/更新元数据/产物泄露门禁
        shell: pwsh
        run: |
          npm run security:artifacts && npm run security:artifacts:packaged && npm run security:release

      # ── 发布验收：Release 必须唯一且可见、三个资产必须齐、latest.yml 的版本/大小/SHA-512 必须对 ──
      #
      # 为什么必须有这一步（2026-09-21 实测的三种**静默成功 / 假红**）：
      #   ① 资产被截断：v1.0.6 首次由 CI 自动发布时，electron-builder 打印了「uploading …exe」
      #      之后作业就结束了 —— 100MB 的 exe 没传完、latest.yml 也没轮到，Release 上只剩一个
      #      .blockmap，而这一步仍判 success。客户端读不到 latest.yml ⇒ 永远收不到更新，CI 却全绿。
      #   ② 同一 tag 两个 Release：electron-builder 每次 publish 会造出两个对象（v1.0.6 / v1.0.7 实测皆然），
      #      而 `/releases/latest` 只认**较新**的那个 ⇒ keeper 必须按 created_at 取最新。
      #   ③ 草稿态：删掉再重推 tag 时 GitHub 会把对应 Release 变成 **draft** —— 草稿既不出现在
      #      `/releases/latest`，也会让 `/releases/tags/<tag>` 返回 404（实测踩过，直接把这一步判红）。
      #      所以这里一律**从发布列表里按 tag_name 找**，先保持/转为草稿，一个都没有就新建草稿。
      # 然后：资产用**同一次构建**的 dist/ 产物覆盖上传，回读 latest.yml 校验版本、大小与
      # SHA-512，全部通过后才把草稿公开。
      # 任一条不满足即失败（宁可红，不要骗过自己的绿）。
      - name: 验收发布资产（收敛重复 / 发布草稿 / 覆盖上传）+ 回读 latest.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = [string]$env:GITHUB_REF_NAME
          $repo = [string]$env:GITHUB_REPOSITORY
          if ($tag -notmatch '^v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)$') {
            throw "非法发布 tag：'$tag'。只接受 v<major>.<minor>.<patch> 及可选预发布后缀。"
          }
          $ver = $Matches[1]
          if ($repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') {
            throw "GITHUB_REPOSITORY 格式异常：'$repo'"
          }
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

          function Get-Sha512Base64File([string]$FilePath) {
            $stream = [System.IO.File]::OpenRead($FilePath)
            try {
              $sha = [System.Security.Cryptography.SHA512]::Create()
              try {
                return [Convert]::ToBase64String($sha.ComputeHash($stream))
              } finally {
                $sha.Dispose()
              }
            } finally {
              $stream.Dispose()
            }
          }

          # ① 从发布列表里解析出本 tag 的 Release（不能只用 `/releases/tags/{tag}`：草稿会 404）。
          $all = @(Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases?per_page=100")
          # PowerShell 5.1 的 Invoke-RestMethod 把 JSON 数组当**单个对象**返回（pwsh 7 会展开）；
          # 这一行把两种语义归一化，免得这段逻辑只在本地/只在 runner 上对。
          if ($all.Count -eq 1 -and $all[0] -is [array]) { $all = @($all[0]) }
          $dupes = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($dupes.Count -eq 0) {
            Write-Host "tag $tag 下没有任何 Release —— 新建一个草稿，上传验收后再公开"
            $rel = Invoke-RestMethod -Method Post -Headers $hdr -ContentType 'application/json' `
              -Body (@{ tag_name = $tag; name = "Super Time $ver"; draft = $true; prerelease = $false } | ConvertTo-Json) `
              -Uri "https://api.github.com/repos/$repo/releases"
          } else {
            $rel = @($dupes | Sort-Object -Property created_at -Descending)[0]
            if ($dupes.Count -gt 1) {
              Write-Host "同一 tag 下有 $($dupes.Count) 个 Release —— 保留最新的 id=$($rel.id)（/releases/latest 取的就是它），其余删除"
              foreach ($r in $dupes) {
                if ($r.id -ne $rel.id) {
                  Invoke-RestMethod -Method Delete -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($r.id)" | Out-Null
                  Write-Host "已删重复 Release id=$($r.id)（资产：$((@($r.assets | ForEach-Object { $_.name }) -join ', '))）"
                }
              }
            }
            if (-not $rel.draft) {
              Write-Host "先将现有 Release 转为草稿，避免删除/重传期间客户端看到不完整资产 id=$($rel.id)"
              $rel = Invoke-RestMethod -Method Patch -Headers $hdr -ContentType 'application/json' `
                -Body (@{ draft = $true; tag_name = $tag } | ConvertTo-Json) `
                -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
            }
          }
          # 重新取一次，拿到收敛后的资产清单
          $rel = Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"

          # ② 每次都用同一次构建的 dist/ 产物覆盖上传（三份一起，避免 exe 与 blockmap 不同源）。
          #    旧脚本只在“缺资产”时补传，重跑同一 tag 会把上一轮的完整资产误当成这一轮。
          $want = @('latest.yml', "Super-Time-Setup-$ver.exe", "Super-Time-Setup-$ver.exe.blockmap")
          $have = @($rel.assets | ForEach-Object { $_.name })
          $files = @(
            (Join-Path dist "Super Time Setup $ver.exe"),
            (Join-Path dist "Super Time Setup $ver.exe.blockmap"),
            (Join-Path dist 'latest.yml')
          )
          foreach ($f in $files) {
            if (-not (Test-Path -LiteralPath $f -PathType Leaf)) { Write-Error "本次构建缺少发布文件：$f"; exit 1 }
          }
          foreach ($a in $rel.assets) {
            Invoke-RestMethod -Method Delete -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/assets/$($a.id)" | Out-Null
          }
          foreach ($f in $files) {
            $name = (Split-Path $f -Leaf) -replace ' ', '-'
            $url = "https://uploads.github.com/repos/$repo/releases/$($rel.id)/assets?name=$name"
            Invoke-RestMethod -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'Content-Type' = 'application/octet-stream' } -InFile $f -Uri $url | Out-Null
            $sizeMb = [math]::Round((Get-Item -LiteralPath $f).Length / 1MB, 1)
            Write-Host "已上传：$name（$sizeMb MB）"
          }
          $rel = Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
          $have = @($rel.assets | ForEach-Object { $_.name })

          # ③ 断言 + 回读 latest.yml（客户端判断「有没有新版本」的唯一依据）
          foreach ($w in $want) {
            if ($have -notcontains $w) { Write-Error "发布不完整：Release $tag 上仍缺 $w"; exit 1 }
          }
          # 资产大小必须与本次 dist/ 完全一致：只核对“名字存在”会放过截断上传。
          foreach ($f in $files) {
            $name = (Split-Path $f -Leaf) -replace ' ', '-'
            $asset = $rel.assets | Where-Object { $_.name -eq $name }
            $localSize = (Get-Item -LiteralPath $f).Length
            if ($null -eq $asset -or [long]$asset.size -ne [long]$localSize) {
              Write-Error "发布资产大小不一致：$name，期望 $localSize，远端 $($asset.size)"
              exit 1
            }
          }

          # 仅比较两份 latest.yml 的 sha512 字段，只能证明元数据被原样回读，不能证明
          # 远端 exe 的字节正确。必须重新下载 GitHub 上的实际安装包并复算 SHA-512，
          # 才能发现大小相同但内容被替换/损坏的上传。
          $installerPath = $files[0]
          $installerName = (Split-Path $installerPath -Leaf) -replace ' ', '-'
          $installerAsset = $rel.assets | Where-Object { $_.name -eq $installerName }
          if ($null -eq $installerAsset) {
            Write-Error "找不到远端安装包资产：$installerName"
            exit 1
          }
          $localInstallerSha = Get-Sha512Base64File $installerPath
          $tempDir = Join-Path ([System.IO.Path]::GetTempPath()) ("supertime-release-" + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
          try {
            $remoteInstallerPath = Join-Path $tempDir $installerName
            Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -Uri $installerAsset.url -OutFile $remoteInstallerPath
            $remoteInstallerSha = Get-Sha512Base64File $remoteInstallerPath
            $remoteInstallerSize = (Get-Item -LiteralPath $remoteInstallerPath).Length
            if ($remoteInstallerSize -ne (Get-Item -LiteralPath $installerPath).Length) {
              throw "远端安装包下载后大小不一致：期望 $((Get-Item -LiteralPath $installerPath).Length)，实际 $remoteInstallerSize"
            }
            if ($localInstallerSha -eq '' -or $remoteInstallerSha -ne $localInstallerSha) {
              throw "远端安装包 SHA-512 与本地构建不一致（本地 '$localInstallerSha'，远端 '$remoteInstallerSha'）"
            }
          } finally {
            Remove-Item -LiteralPath $tempDir -Recurse -Force -ErrorAction SilentlyContinue
          }

          $asset = $rel.assets | Where-Object { $_.name -eq 'latest.yml' }
          $content = (Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -Uri $asset.url).Content
          # PowerShell 7 在 application/octet-stream 下把 Content 给成 byte[]（正则匹配会**总是失败**，
          # 于是把一份完好的发布误判成「版本不对」—— 2026-09-21 v1.0.7 首次运行就这么红过一次）
          if ($content -is [byte[]]) { $content = [System.Text.Encoding]::UTF8.GetString($content) }
          $yml = [string]$content
          if ($yml -notmatch "(?m)^version:\s*$ver\s*$") { Write-Error "latest.yml 里的版本不是 $ver（回读内容前 80 字符：$($yml.Substring(0, [Math]::Min(80, $yml.Length)))）"; exit 1 }
          $localYml = [string](Get-Content (Join-Path dist 'latest.yml') -Raw)
          $localSha = [regex]::Match($localYml, '(?m)^sha512:\s*([A-Za-z0-9+/=]+)\s*$').Groups[1].Value
          $remoteSha = [regex]::Match($yml, '(?m)^sha512:\s*([A-Za-z0-9+/=]+)\s*$').Groups[1].Value
          if ($localSha -eq '' -or $localSha -ne $localInstallerSha -or $remoteSha -ne $localInstallerSha) {
            throw "latest.yml 的 sha512 与安装包实算值不一致（本地 yml '$localSha'，远端 yml '$remoteSha'，安装包 '$localInstallerSha'）"
          }
          # 只有资产、大小、版本、远端安装包实算摘要和更新元数据全部对上，才把草稿公开。
          $rel = Invoke-RestMethod -Method Patch -Headers $hdr -ContentType 'application/json' `
            -Body (@{ draft = $false; prerelease = $false; tag_name = $tag } | ConvertTo-Json) `
            -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
          Write-Host "发布验收通过：$ver（3 个资产齐备、远端安装包 SHA-512 实算一致、Release 已公开）"
