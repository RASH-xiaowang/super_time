name: Release

# 打 tag（如 v1.2.0）即发布：构建 NSIS 安装包，并把 exe / latest.yml / blockmap 传到
# GitHub Releases。安装版的自动更新正是从这次 Release 拉 latest.yml 的 ——
# 所以「本工作流成功」≈「用户能收到这次更新」，两者不是两件事。
#
# 为什么不监听分支：更新只在版本号变化时才发生，而版本号由 tag 决定。
# 每次 push 都发一版会让 latest.yml 反复被覆盖，客户端下到的可能是半成品。
on:
  push:
    tags: ['v*']

# electron-builder 要往 Releases 写资产
permissions:
  contents: write

# 串行发布：两次 tag 同时跑会让两个进程抢着写同一个 release。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖
        run: npm ci

      # ── 发布门禁：必须在这里自己跑 ──
      # ci.yml 只监听分支（`branches: ['**']` 不匹配 tag），**tag 推送不会触发它**，
      # 所以「CI 绿了再发版」这条链路并不成立 —— 不自己跑就等于没验过就发版。
      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      # ── 版本一致性门禁 ──
      # 最容易犯、也最难发现的错：tag 写 v1.2.0 而 package.json 还是 1.0.0。
      # 这样打出来的包 app.getVersion() 是 1.0.0，latest.yml 里的版本也是 1.0.0，
      # electron-updater 于是判定「没有新版本」—— 升级**永远不发生**，
      # 而且主进程不会报任何错（连日志都没有）。只能靠这道门禁挡。
      - name: tag 与 package.json 版本必须一致
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($tag -ne $pkg) {
            Write-Error "tag '${{ github.ref_name }}' 与 package.json 的版本 '$pkg' 不一致 —— 更新将永远不会被触发"
            exit 1
          }
          Write-Host "版本一致：$tag"

      # `npm run dist` = 先 build:ui 再 electron-builder --win nsis。
      # `-- --publish always` 把参数追加到脚本末尾，最终是
      # `npm run build:ui && electron-builder --win nsis --publish always`。
      # publish 配置里的 releaseType 是 release（不是默认的 draft）：
      # draft 发布对 electron-updater **不可见**，会让更新静默失效。
      - name: 打包并发布到 Releases
        run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 发布验收：Release 必须唯一且可见、三个资产必须齐、latest.yml 的版本必须对；缺了就从 dist/ 补传 ──
      #
      # 为什么必须有这一步（2026-09-21 实测的三种**静默成功 / 假红**）：
      #   ① 资产被截断：v1.0.6 首次由 CI 自动发布时，electron-builder 打印了「uploading …exe」
      #      之后作业就结束了 —— 100MB 的 exe 没传完、latest.yml 也没轮到，Release 上只剩一个
      #      .blockmap，而这一步仍判 success。客户端读不到 latest.yml ⇒ 永远收不到更新，CI 却全绿。
      #   ② 同一 tag 两个 Release：electron-builder 每次 publish 会造出两个对象（v1.0.6 / v1.0.7 实测皆然），
      #      而 `/releases/latest` 只认**较新**的那个 ⇒ keeper 必须按 created_at 取最新。
      #   ③ 草稿态：删掉再重推 tag 时 GitHub 会把对应 Release 变成 **draft** —— 草稿既不出现在
      #      `/releases/latest`，也会让 `/releases/tags/<tag>` 返回 404（实测踩过，直接把这一步判红）。
      #      所以这里一律**从发布列表里按 tag_name 找**，找到草稿就发布它，一个都没有就新建。
      # 然后：缺的资产用**同一次构建**的 dist/ 产物补传，最后回读 latest.yml 校验版本号。
      # 任一条不满足即失败（宁可红，不要骗过自己的绿）。
      - name: 验收发布资产（收敛重复 / 发布草稿 / 缺则补传）+ 回读 latest.yml
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          $ver = $tag.TrimStart('v')
          $repo = '${{ github.repository }}'
          $hdr = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }

          # ① 从发布列表里解析出本 tag 的 Release（不能只用 `/releases/tags/{tag}`：草稿会 404）。
          $all = @(Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases?per_page=100")
          # PowerShell 5.1 的 Invoke-RestMethod 把 JSON 数组当**单个对象**返回（pwsh 7 会展开）；
          # 这一行把两种语义归一化，免得这段逻辑只在本地/只在 runner 上对。
          if ($all.Count -eq 1 -and $all[0] -is [array]) { $all = @($all[0]) }
          $dupes = @($all | Where-Object { $_.tag_name -eq $tag })
          if ($dupes.Count -eq 0) {
            Write-Host "tag $tag 下没有任何 Release —— 新建一个（draft=false）"
            $rel = Invoke-RestMethod -Method Post -Headers $hdr -ContentType 'application/json' `
              -Body (@{ tag_name = $tag; name = "Super Time $ver"; draft = $false; prerelease = $false } | ConvertTo-Json) `
              -Uri "https://api.github.com/repos/$repo/releases"
          } else {
            $rel = @($dupes | Sort-Object -Property created_at -Descending)[0]
            if ($dupes.Count -gt 1) {
              Write-Host "同一 tag 下有 $($dupes.Count) 个 Release —— 保留最新的 id=$($rel.id)（/releases/latest 取的就是它），其余删除"
              foreach ($r in $dupes) {
                if ($r.id -ne $rel.id) {
                  Invoke-RestMethod -Method Delete -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($r.id)" | Out-Null
                  Write-Host "已删重复 Release id=$($r.id)（资产：$((@($r.assets | ForEach-Object { $_.name }) -join ', '))）"
                }
              }
            }
            if ($rel.draft) {
              Write-Host "该 Release 是草稿（draft 对客户端不可见）—— 发布它 id=$($rel.id)"
              $rel = Invoke-RestMethod -Method Patch -Headers $hdr -ContentType 'application/json' `
                -Body (@{ draft = $false; tag_name = $tag } | ConvertTo-Json) `
                -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
            }
          }
          # 重新取一次，拿到收敛后的资产清单
          $rel = Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"

          # ② 缺资产则用同一次构建的 dist/ 产物补传（三份一起，避免 exe 与 blockmap 不同源）
          $want = @('latest.yml', "Super-Time-Setup-$ver.exe", "Super-Time-Setup-$ver.exe.blockmap")
          $have = @($rel.assets | ForEach-Object { $_.name })
          $missing = @($want | Where-Object { $have -notcontains $_ })
          if ($missing.Count -gt 0) {
            Write-Host "缺资产：$($missing -join ', ') —— 补传 dist/ 产物"
            foreach ($a in $rel.assets) {
              Invoke-RestMethod -Method Delete -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/assets/$($a.id)" | Out-Null
            }
            foreach ($f in Get-ChildItem dist -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' }) {
              $name = $f.Name -replace ' ', '-'
              $url = "https://uploads.github.com/repos/$repo/releases/$($rel.id)/assets?name=$name"
              Invoke-RestMethod -Method Post -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; 'Content-Type' = 'application/octet-stream' } -InFile $f.FullName -Uri $url | Out-Null
              Write-Host "已补传：$name（$([math]::Round($f.Length / 1MB, 1)) MB）"
            }
            $rel = Invoke-RestMethod -Headers $hdr -Uri "https://api.github.com/repos/$repo/releases/$($rel.id)"
            $have = @($rel.assets | ForEach-Object { $_.name })
          }

          # ③ 断言 + 回读 latest.yml（客户端判断「有没有新版本」的唯一依据）
          foreach ($w in $want) {
            if ($have -notcontains $w) { Write-Error "发布不完整：Release $tag 上仍缺 $w"; exit 1 }
          }
          $asset = $rel.assets | Where-Object { $_.name -eq 'latest.yml' }
          $content = (Invoke-WebRequest -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/octet-stream' } -Uri $asset.url).Content
          # PowerShell 7 在 application/octet-stream 下把 Content 给成 byte[]（正则匹配会**总是失败**，
          # 于是把一份完好的发布误判成「版本不对」—— 2026-09-21 v1.0.7 首次运行就这么红过一次）
          if ($content -is [byte[]]) { $content = [System.Text.Encoding]::UTF8.GetString($content) }
          $yml = [string]$content
          if ($yml -notmatch "(?m)^version:\s*$ver\s*$") { Write-Error "latest.yml 里的版本不是 $ver（回读内容前 80 字符：$($yml.Substring(0, [Math]::Min(80, $yml.Length)))）"; exit 1 }
          Write-Host "发布验收通过：$ver（3 个资产齐备、Release 唯一、latest.yml 版本一致）"
