<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: blob: https: file:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https:" />
  <title>微信+</title>

<body>
  <div id="titlebar">
    <div class="tb-side">
      <span class="tb-logo" aria-hidden="true">

      </span>
      <span class="tb-title">微信+</span>
    </div>
    <div class="tb-controls">
      <button id="tb-min" class="tb-btn" title="最小化" aria-label="最小化">

      </button>
      <button id="tb-close" class="tb-btn tb-close" title="关闭" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8" /></svg>
      </button>

  <div id="root">
