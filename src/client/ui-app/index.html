<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- connect-src 不再用 `https:` 通配，改为显式列出渲染进程真实会取的外网主机：
       world 地图 GeoJSON（jsdelivr / unpkg）+ 省/市/区县 GeoJSON（geo.datav.aliyun.com）。
       漏掉 aliyun 会把省/市/区县地图的取数打断（评审实测的回归）。
       LLM 与 embedding 的 HTTP 调用都发生在后端 worker（Node 侧），不受页面 CSP 约束。
       `data:` 是必需的（只写 'self' 时 fetch(data:) 会被拦）；`file:` 其实冗余
       （file:// 文档下 'self' 已含整个 file: scheme），留着的代价是显式，不影响。 -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: blob: https: file:; media-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'self'; connect-src 'self' data: blob: file: https://cdn.jsdelivr.net https://unpkg.com https://geo.datav.aliyun.com" />
  <title>微信+</title>
</head>
<body>
  <div id="titlebar">
    <div class="tb-side">
      <span class="tb-logo" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M9.5 3.5C4.8 3.5 1 6.8 1 10.9c0 2.3 1.2 4.4 3.2 5.8L3 20l3.7-1.6c.9.3 1.8.4 2.8.4 4.7 0 8.5-3.3 8.5-7.9S14.2 3.5 9.5 3.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          <circle cx="6.2" cy="10.8" r="1" fill="currentColor" />
          <circle cx="9.7" cy="10.8" r="1" fill="currentColor" />
          <circle cx="13.2" cy="10.8" r="1" fill="currentColor" />
        </svg>
      </span>
      <span class="tb-title">微信+</span>
    </div>
    <div class="tb-controls">
      <button id="tb-min" class="tb-btn" title="最小化" aria-label="最小化">
        <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2" /></svg>
      </button>
      <!-- 全屏：两种图标都在 DOM 里，由 data-on 切换（进入全屏后换成「退出」图标） -->
      <button id="tb-full" class="tb-btn" title="全屏" aria-label="切换全屏">
        <svg class="tb-ico-enter" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M1.5 4.5V1.5h3M7.5 1.5h3v3M10.5 7.5v3h-3M4.5 10.5h-3v-3" />
        </svg>
        <svg class="tb-ico-exit" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
          <path d="M4.5 1.5v3h-3M7.5 1.5v3h3M10.5 7.5h-3v3M1.5 7.5h3v3" />
        </svg>
      </button>
      <button id="tb-close" class="tb-btn tb-close" title="关闭" aria-label="关闭">
        <svg width="12" height="12" viewBox="0 0 12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M2 2l8 8M10 2l-8 8" /></svg>
      </button>
    </div>
  </div>
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100%;background:#050a18;color:#00f0ff;font-family:sans-serif">
      正在加载微信+界面…
    </div>
  </div>
  <script type="module" src="./ui-entry.tsx"></script>
</body>
</html>
